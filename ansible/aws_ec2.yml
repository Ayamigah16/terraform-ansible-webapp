# AWS EC2 Dynamic Inventory Configuration
plugin: amazon.aws.aws_ec2

# AWS region(s) to query
# IMPORTANT: Must match terraform/variables.tf aws_region default or your terraform.tfvars
regions:
- eu-west-1

# Filter instances by tags
# IMPORTANT: Values must match terraform tags (Project and Environment from terraform/variables.tf)
filters:
  instance-state-name: running
  tag:Project: terraform-ansible-webapp
  tag:Environment: dev

# Keyed groups - organize hosts by tags
keyed_groups:
# Group by instance role
- key: tags.Role
  prefix: role
  separator: "_"

# Group by environment
- key: tags.Environment
  prefix: env
  separator: "_"

# Group by instance type
- key: instance_type
  prefix: type
  separator: "_"

# Compose variables from instance attributes
compose:
  ansible_host: "{{ public_ip_address if 'frontend' in (tags.Role|lower) else private_ip_address }}"
  # ansible_host: >
  #   {% if 'frontend' in (tags.Role|lower) %}
  #     {{ public_ip_address }}
  #   {% else %}
  #     {{ private_ip_address }}
  #   {% endif %}
  ansible_user: ec2-user
  ansible_ssh_private_key_file: ./keys/terraform-ansible-webapp-key.pem
  instance_name: "{{ tags.Name | default('') }}"
  instance_role: "{{ tags.Role | default('') }}"
  environment: "{{ tags.Environment | default('') }}"
  project: "{{ tags.Project | default('') }}"
  managed_by: "{{ tags.ManagedBy | default('') }}"
  private_ip: "{{ private_ip_address }}"
  public_ip: "{{ public_ip_address }}"

# Hostnames - how to identify instances
# hostnames:
#   - public_ip_address
#   - private_ip_address
hostname_variable: public_ip_address

# Use strict mode to catch errors
strict: False

# Include/exclude hosts
# exclude_filters:
#   - instance-state-name: stopped
#   - instance-state-name: terminated
