---
# Backend Role Default Variables

# Application directory
app_dir: "/home/{{ ansible_user }}/backend"

# Backend API port
backend_port: 3001
backend_api_url: "http://10.0.10.41:3001"

# Database configuration (should be overridden)
db_host: "{{ db_host | default('') }}"
db_port: 5432
db_username: "{{ db_username | default('') }}"
db_password: "{{ db_password | default('') }}"
db_name: "{{ db_name | default('') }}"
# Project name
project_name: "terraform-ansible-webapp"